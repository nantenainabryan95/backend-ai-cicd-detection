services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vulnscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: vulnscan
      POSTGRES_DB: vulnscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
