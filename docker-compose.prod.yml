name: vulnscan-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?d?finir POSTGRES_PASSWORD dans .env.prod}
      POSTGRES_DB: vulnscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscan -d vulnscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vulnscan:${POSTGRES_PASSWORD}@postgres:5432/vulnscan
      JWT_SECRET: ${JWT_SECRET:?d?finir JWT_SECRET dans .env.prod}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:?d?finir LLM_API_KEY dans .env.prod}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SCAN_ROOT:-/srv/vulnscan/workspaces}:${SCAN_ROOT:-/srv/vulnscan/workspaces}
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
